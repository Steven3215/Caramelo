name: Verify Caramelo installation on Cloudstream 4.8.0
on:
  push:
    branches: [verify-cloudstream-4.8.0]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official stable APK
        run: curl --fail --location --retry 3 'https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk' -o "$RUNNER_TEMP/cloudstream.apk"
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and load the public extensions in Cloudstream
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/verify-cloudstream-install.sh
