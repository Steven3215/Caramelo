name: Build Cloudstream extensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CinemaArmy/**'
      - 'UniqueStreamAnime/**'
      - 'Sportsbite/**'
      - 'GlobalFreeTV/**'
      - 'Movy/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - 'tools/smoke_cinema.py'
      - 'tools/smoke_unique.py'
      - 'tools/smoke_sportsbite.py'
      - 'tools/smoke_globalfreetv.py'
      - 'tools/smoke_movy.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 7cc64f92d88350ecbf775d6332de14dcaa71dcda
          path: build-tools/cloudstream-gradle
      - name: Live API and public-domain playback smoke test
        continue-on-error: true
        run: python3 tools/smoke_cinema.py
      - name: Live UniqueStream API and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_unique.py
      - name: Live Sportsbite catalog and player smoke test
        continue-on-error: true
        run: python3 tools/smoke_sportsbite.py
      - name: Live Global Free TV catalog and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_globalfreetv.py
      - name: Live Movy catalog and public-domain playback smoke test
        continue-on-error: true
        run: python3 tools/smoke_movy.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Unit tests and extension build
        run: gradle CinemaArmy:testDebugUnitTest UniqueStreamAnime:testDebugUnitTest Sportsbite:testDebugUnitTest GlobalFreeTV:testDebugUnitTest Movy:testDebugUnitTest CinemaArmy:make UniqueStreamAnime:make Sportsbite:make GlobalFreeTV:make Movy:make --stacktrace
      - name: Save compiled extensions
        uses: actions/upload-artifact@v4
        with:
          name: CloudstreamExtensions
          path: |
            **/build/**/*.cs3
          if-no-files-found: error
          retention-days: 7
