name: Build private extension artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build provider skeleton
        run: gradle CinemaArmy:make --stacktrace
      - name: Save private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaArmy-skeleton
          path: |
            **/build/**/*.cs3
          if-no-files-found: error
          retention-days: 7
