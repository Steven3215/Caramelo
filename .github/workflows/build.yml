name: Build Cloudstream extensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CinemaArmy/**'
      - 'UniqueStreamAnime/**'
      - 'Sportsbite/**'
      - 'GlobalFreeTV/**'
      - 'Movy/**'
      - 'Corsflix/**'
      - 'Nekowatch/**'
      - 'AnimeSuge/**'
      - 'Teleonline/**'
      - 'TeleLibre/**'
      - 'JustAnime/**'
      - 'ThugTV/**'
      - 'Lightflix/**'
      - 'Nexa/**'
      - 'Moonflix/**'
      - 'SoloLatino/**'
      - 'tools/smoke_sololatino.py'
      - 'shared-movies/**'
      - 'tools/smoke_movie_catalogs.py'
      - 'tools/smoke_teletv.py'
      - 'tools/smoke_justanime_thugtv.py'
      - 'shared-settings/**'
      - 'shared-tracks/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - 'tools/smoke_cinema.py'
      - 'tools/smoke_unique.py'
      - 'tools/smoke_sportsbite.py'
      - 'tools/smoke_globalfreetv.py'
      - 'tools/smoke_movy.py'
      - 'tools/smoke_corsflix.py'
      - 'tools/smoke_nekowatch.py'
      - 'tools/smoke_animesuge.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 7cc64f92d88350ecbf775d6332de14dcaa71dcda
          path: build-tools/cloudstream-gradle
      - name: Live API and public-domain playback smoke test
        continue-on-error: true
        run: python3 tools/smoke_cinema.py
      - name: Live UniqueStream API and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_unique.py
      - name: Live Sportsbite catalog and player smoke test
        continue-on-error: true
        run: python3 tools/smoke_sportsbite.py
      - name: Live Global Free TV catalog and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_globalfreetv.py
      - name: Live Movy catalog and public-domain playback smoke test
        continue-on-error: true
        run: python3 tools/smoke_movy.py
      - name: Live Corsflix catalog and embed metadata smoke test
        continue-on-error: true
        run: python3 tools/smoke_corsflix.py
      - name: Live Nekowatch API and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_nekowatch.py
      - name: Live AnimeSuge API and HLS smoke test
        continue-on-error: true
        run: python3 tools/smoke_animesuge.py
      - name: Live Teleonline and Tele Libre directory and broadcaster smoke test
        continue-on-error: true
        run: python3 tools/smoke_teletv.py
      - name: Live JustAnime and ThugTV catalog and media smoke test
        continue-on-error: true
        run: python3 tools/smoke_justanime_thugtv.py
      - name: Live Lightflix, Nexa and Moonflix catalog checks
        continue-on-error: true
        run: python3 tools/smoke_movie_catalogs.py
      - name: Live SoloLatino catalog and anonymous embed check
        continue-on-error: true
        run: python3 tools/smoke_sololatino.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Unit tests and extension build
        run: gradle CinemaArmy:testDebugUnitTest UniqueStreamAnime:testDebugUnitTest Sportsbite:testDebugUnitTest GlobalFreeTV:testDebugUnitTest Movy:testDebugUnitTest Corsflix:testDebugUnitTest Nekowatch:testDebugUnitTest AnimeSuge:testDebugUnitTest CinemaArmy:make UniqueStreamAnime:make Sportsbite:make GlobalFreeTV:make Movy:make Corsflix:make Nekowatch:make AnimeSuge:make Teleonline:testDebugUnitTest TeleLibre:testDebugUnitTest Teleonline:make TeleLibre:make JustAnime:make ThugTV:make Lightflix:make Nexa:make Moonflix:make SoloLatino:make --stacktrace
      - name: Save compiled extensions
        uses: actions/upload-artifact@v4
        with:
          name: CloudstreamExtensions
          path: |
            **/build/**/*.cs3
          if-no-files-found: error
          retention-days: 7
